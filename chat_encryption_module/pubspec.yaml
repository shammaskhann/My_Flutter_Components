name: chat_encryption_module
description: A complete, production-ready Flutter package for building end-to-end encrypted chat applications with Firebase and RSA encryption.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.29.0
  cloud_firestore: ^5.4.0
  firebase_auth: ^5.1.4
  firebase_storage: ^12.1.4
  crypton: ^2.0.0
  uuid: ^4.0.0
  flutter_riverpod: ^2.6.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  freezed: ^2.4.7
  json_serializable: ^6.8.0

flutter:
  # No assets or fonts since this is a module
  uses-material-design: true
